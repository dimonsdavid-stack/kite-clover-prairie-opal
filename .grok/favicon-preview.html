<!doctype html>
<html>
  <head>
    <style>
      html, body { margin: 0; padding: 0; background: #333; }
      .row { display: flex; gap: 32px; padding: 24px; align-items: flex-end; }
      .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #eee; font: 12px sans-serif; }
      .box16 { width: 16px; height: 16px; }
      .box32 { width: 32px; height: 32px; }
      .box64 { width: 64px; height: 64px; }
      img { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="tile">
        <div class="box16"><img src="./favicon-inline.svg" alt=""></div>
        16
      </div>
      <div class="tile">
        <div class="box32"><img src="./favicon-inline.svg" alt=""></div>
        32
      </div>
      <div class="tile">
        <div class="box64"><img src="./favicon-inline.svg" alt=""></div>
        64
      </div>
    </div>
  </body>
</html>
